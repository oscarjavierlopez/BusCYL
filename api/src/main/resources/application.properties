spring.application.name=api
server.port=3000

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${APP_DB:buscyl}?currentSchema=buscyl&ssl=false
spring.datasource.username=${APP_DB_USER}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

buscyl.jwt.expiration-seconds=${EXPIRATION}
buscyl.jwt.key=${JWT_SECRET_KEY}

buscyl.auth.rate-limit.max-requests=3
buscyl.auth.rate-limit.window=PT15M

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

buscyl.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
buscyl.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL}
